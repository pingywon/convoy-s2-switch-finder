<style>
#s2c{--bg:#070d13;--sf:#0d151d;--sf2:#141f2a;--ln:#243543;
 --ink:#f3f7fa;--ink2:#adbecb;--ink3:#8194a3;
 --ac:#9aa8ff;--acs:#181e38;--acl:#4a5286;
 --ok:#00ff9f;--okb:#052a20;--okl:#16785a;
 --no:#ff5c86;--nob:#2e0f1c;--nol:#84294a;
 --wn:#ffb84d;--wnb:#2e2209;--wnl:#7f5c1c;
 --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
 color:var(--ink);line-height:1.5;display:block;text-align:left;font-size:18px;padding-bottom:120px}
#s2c *{box-sizing:border-box}
@media(min-width:1000px){#s2c{width:min(1180px,94vw);margin-left:calc(50% - min(590px,47vw))}}
#s2c h3{margin:0;color:var(--ink)}#s2c p{margin:0;color:var(--ink)}
#s2c a{color:var(--ac);text-decoration:none}
#s2c .steps{display:flex;flex-direction:column;gap:16px}
/* step shell */
#s2c .stp{border:2px solid var(--ln);border-radius:10px;background:var(--sf);overflow:hidden;
 transition:opacity .2s,border-color .2s,filter .2s}
#s2c .stp[data-s="lock"]{opacity:.32;filter:grayscale(.55);pointer-events:none}
#s2c .stp[data-s="active"]{border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
#s2c .stp[data-s="done"]{border-color:var(--okl)}
#s2c .sh{display:flex;align-items:center;gap:14px;padding:18px 22px;background:var(--sf2);
 border-bottom:2px solid var(--ln)}
#s2c .stp[data-s="active"] .sh{background:var(--acs);border-bottom-color:var(--acl)}
#s2c .stp[data-s="done"] .sh{background:var(--okb);border-bottom-color:var(--okl)}
#s2c .sn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;
 font-family:var(--mono);font-size:19px;font-weight:800;background:var(--ln);color:var(--ink2)}
#s2c .stp[data-s="active"] .sn{background:var(--ac);color:#070d13}
#s2c .stp[data-s="done"] .sn{background:var(--ok);color:#070d13}
#s2c .sn svg{width:22px;height:22px}
#s2c .sh h3{font-size:22px;font-weight:800;letter-spacing:-.015em;flex:1;line-height:1.15}
#s2c .snote{font-family:var(--mono);font-size:14px;color:var(--ink3);text-align:right;max-width:44%}
#s2c .stp[data-s="done"] .snote{color:var(--ok)}
#s2c .sb{padding:22px}
#s2c .lede{font-size:17px;color:var(--ink2);line-height:1.55}
#s2c .lede b{color:var(--ink)}
#s2c .grp{margin-bottom:20px}#s2c .grp:last-child{margin-bottom:0}
#s2c .grpt{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--ink3);padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--ln)}
#s2c .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
#s2c .pgrid-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
#s2c .pgrid-s{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
/* pickable */
#s2c .pick{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:14px 16px;
 background:var(--bg);border:2px solid var(--ln);border-radius:8px;cursor:pointer;font:inherit;
 font-size:17px;font-weight:700;color:var(--ink);text-align:left;transition:border-color .13s,transform .13s,background .13s}
#s2c .pick:hover{border-color:var(--ac);background:var(--sf2);transform:translateY(-2px)}
#s2c .pick:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
#s2c .pick[aria-pressed="true"]{border-color:var(--ac);background:var(--acs);box-shadow:inset 0 0 0 2px var(--ac)}
#s2c .pick[data-oos]{opacity:.5}
#s2c .host{flex-wrap:wrap;row-gap:8px;align-items:center;min-height:78px}
#s2c .host .chip{order:1}
#s2c .host .pn{order:2;flex:1 1 calc(100% - 44px);font-size:16px}
#s2c .host .pp{order:3;flex:0 0 auto}
#s2c .host .cap{order:4;margin-left:auto;flex:0 0 auto}
#s2c .chip{width:30px;height:30px;flex:0 0 30px;border-radius:6px;border:1px solid rgba(175,190,205,.38);
 box-shadow:inset 0 -7px 11px -6px rgba(0,0,0,.7)}
#s2c .chip-x{background:var(--sf2)}
#s2c .pn{flex:1;min-width:0;line-height:1.25}
#s2c .psub{display:block;font-family:var(--mono);font-size:12.5px;font-weight:400;color:var(--ok);margin-top:4px}
#s2c .pn em{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--wn)}
#s2c .pp{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink3)}
#s2c .cap{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
 padding:3px 7px;border-radius:4px;border:1px solid;white-space:nowrap}
#s2c .cap-full{color:var(--ok);border-color:var(--okl);background:var(--okb)}
#s2c .cap-center{color:var(--wn);border-color:var(--wnl);background:var(--wnb)}
#s2c .cap-unknown{color:var(--no);border-color:var(--nol);background:var(--nob)}
#s2c .star{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
 padding:3px 7px;border-radius:4px;background:var(--ok);color:#070d13;font-weight:800;white-space:nowrap}
#s2c .opt-star{border-color:var(--okl)}
#s2c .star-off{background:var(--wnb);color:var(--wn);border:1px solid var(--wnl)}
/* switch cards */
#s2c .swc{flex-direction:column;align-items:stretch;gap:9px;min-height:0;padding:18px}
#s2c .swn{font-size:21px;font-weight:800;line-height:1.15}
#s2c .swp{font-family:var(--mono);font-size:23px;font-weight:800;color:var(--ok)}
#s2c .swt{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
 text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid}
#s2c .swt.lit{color:var(--ac);border-color:var(--acl);background:var(--acs)}
#s2c .swt.nolit{color:var(--ink3);border-color:var(--ln);background:var(--sf2)}
#s2c .swd{font-size:15px;font-weight:400;color:var(--ink2);line-height:1.45}
#s2c .swa{font-family:var(--mono);font-size:12.5px;font-weight:400;color:var(--ink3);
 padding-top:10px;border-top:1px solid var(--ln)}
/* messages */
#s2c .msg{display:flex;gap:13px;padding:16px 18px;border-radius:8px;border:1px solid;margin-bottom:16px;
 font-size:16px;line-height:1.5}
#s2c .msg svg{width:24px;height:24px;flex:0 0 24px;margin-top:2px}
#s2c .msg>div>b:first-child{display:block;margin-bottom:4px}
#s2c .msg p{font-size:15.5px;color:var(--ink2)}
#s2c .msg-warn{background:var(--wnb);border-color:var(--wnl);color:var(--wn)}
#s2c .msg-rule{background:var(--acs);border-color:var(--acl);color:var(--ac)}
#s2c .msg-dc{background:var(--okb);border-color:var(--okl);color:var(--ok)}
/* glow readout */
#s2c .glow{border:2px solid var(--ln);border-radius:8px;padding:20px;margin-bottom:18px;background:var(--bg)}
#s2c .gt{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-bottom:8px}
#s2c .glow p{font-size:16px;color:var(--ink2);line-height:1.5}
#s2c .glow-double{border-color:var(--ok);background:var(--okb);box-shadow:0 0 0 4px rgba(0,255,159,.08)}
#s2c .glow-double .gt{color:var(--ok)}
#s2c .glow-face .gt{color:var(--ac)}#s2c .glow-face{border-color:var(--acl);background:var(--acs)}
#s2c .glow-edge .gt{color:var(--wn)}#s2c .glow-edge{border-color:var(--wnl);background:var(--wnb)}
#s2c .glow-none .gt,#s2c .glow-pick .gt{color:var(--ink2)}
/* parts */
#s2c .parts{display:flex;flex-direction:column;gap:9px}
#s2c .part{display:flex;align-items:center;gap:13px;padding:15px 16px;background:var(--bg);
 border:1px solid var(--ln);border-radius:8px;font-size:17px;font-weight:600;color:var(--ink);
 transition:border-color .13s}
#s2c .part:hover{border-color:var(--ok)}
#s2c .part .pp{color:var(--ok);font-size:18px}
#s2c .fine{font-size:14.5px;color:var(--ink3);margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}
/* board columns */
#s2c .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:880px){#s2c .cols2{grid-template-columns:1fr}}
#s2c .cw{border:2px solid var(--ln);border-radius:9px;overflow:hidden;margin-bottom:14px}
#s2c .cw-full{border-color:var(--okl)}#s2c .cw-center{border-color:var(--wnl)}
#s2c .cw-unknown{border-color:var(--nol)}
#s2c .cwh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
 font-size:19px;font-weight:800}
#s2c .cw-full .cwh{background:var(--okb);color:var(--ok)}
#s2c .cw-center .cwh{background:var(--wnb);color:var(--wn)}
#s2c .cw-unknown .cwh{background:var(--nob);color:var(--no)}
#s2c .cwh span{font-family:var(--mono);font-size:28px}
#s2c .cwl{padding:12px;display:flex;flex-direction:column;gap:9px}
/* sticky cart bar */
#s2c .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(7,13,19,.96);
 border-top:2px solid var(--ln);padding:14px 20px;z-index:90;transform:translateY(110%);
 transition:transform .25s;backdrop-filter:blur(8px)}
#s2c .bar.on{transform:none}
#s2c .barin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
#s2c .bartxt{flex:1;min-width:170px;line-height:1.25}
#s2c .bartxt b{display:block;font-size:19px;font-weight:800}
#s2c .bartxt span{font-size:14px;color:var(--ink3);font-family:var(--mono)}
#s2c .cta{font:inherit;font-size:19px;font-weight:800;padding:16px 32px;border-radius:8px;border:none;
 background:var(--ok);color:#070d13;cursor:pointer;text-decoration:none;display:inline-block;
 transition:opacity .13s}
#s2c .cta:hover{opacity:.87;text-decoration:none}
#s2c .cta:disabled{background:var(--ln);color:var(--ink3);cursor:not-allowed}
#s2c .cta:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
@media(prefers-reduced-motion:reduce){#s2c *{transition:none!important}}

#s2c .stp:first-child .sb{padding:18px}
#s2c .cwl .pick{background:var(--sf)}

/* ===== late overrides (appended at end of stylesheet, always applied) ===== */
#s2c .btnlink{background:none;border:none;color:var(--ac);font:inherit;font-size:16px;font-weight:700;cursor:pointer;padding:10px 0;text-decoration:underline}
#s2c .opticwrap{display:contents}
#s2c .acc{display:block;width:100%;text-align:left;margin-top:14px;padding:16px 18px;background:var(--sf2);
 border:2px dashed var(--ln);border-radius:8px;cursor:pointer;font:inherit;color:var(--ink)}
#s2c .acc:hover{border-color:var(--ac);border-style:solid}
#s2c .acc:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
#s2c .accchev{display:inline-block;width:24px;color:var(--ac);font-size:19px;vertical-align:baseline}
#s2c .acctxt{font-size:18px;font-weight:800}
#s2c .accsub{display:block;margin-left:24px;font-size:14.5px;color:var(--ink3);margin-top:4px;line-height:1.45}
#s2c .confirmrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px;padding:16px 18px;
 background:var(--acs);border:2px solid var(--acl);border-radius:8px}
#s2c .confirmrow p{flex:1;min-width:220px;font-size:16px;color:var(--ink2);margin:0}
#s2c .btn.go{background:var(--ok);color:#070d13;border-color:var(--ok);font-weight:800}
#s2c .btn.go:hover{opacity:.88;color:#070d13}
#s2c .stp.justmoved{box-shadow:0 0 0 6px var(--acs),0 0 0 8px var(--ac)}
#s2c .ackwrap{margin-top:24px;border:3px solid var(--wnl);border-radius:12px;overflow:hidden;background:var(--wnb)}
#s2c .ackwrap.on{border-color:var(--ok);background:var(--okb)}
#s2c .ackhead{padding:15px 20px;font-size:20px;font-weight:800;background:rgba(0,0,0,.3);color:var(--wn)}
#s2c .ackwrap.on .ackhead{color:var(--ok)}
#s2c .ackbox{display:flex;gap:18px;align-items:flex-start;padding:24px 20px;cursor:pointer;font-size:19px;
 line-height:1.5;color:var(--ink);font-weight:600;margin:0}
#s2c .ackbox input{width:34px;height:34px;flex:0 0 34px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
#s2c .nickrow{margin-top:20px}
#s2c .nickrow label{display:block;font-size:16px;font-weight:700;margin-bottom:8px}
#s2c .nickrow label em{font-style:normal;font-weight:400;color:var(--ink3)}
#s2c .nickrow input{width:100%;padding:14px 16px;font:inherit;font-size:18px;border-radius:8px;
 background:var(--bg);border:2px solid var(--ln);color:var(--ink)}
#s2c .nickrow input:focus{outline:none;border-color:var(--ac)}
#s2c .buildtag{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--sf2);
 border-left:4px solid var(--ok);font-size:16px;color:var(--ink)}
#s2c .buildtag b{color:var(--ok)}
#s2c .buildtag span{display:block;font-size:14.5px;color:var(--ink3);margin-top:5px;line-height:1.45}

/* Outcome readouts are neutral by default — "outer ring glows" is a normal
   choice, not a warning. Only genuine surprises (an opaque button) stay amber. */
#s2c .glow-ok{border-color:var(--okl);background:var(--okb)}
#s2c .glow-ok .gt{color:var(--ok)}
#s2c .glow-ring{border-color:var(--ln);background:var(--sf2)}
#s2c .glow-ring .gt{color:var(--ink)}
#s2c .glow-warn{border-color:var(--wnl);background:var(--wnb)}
#s2c .glow-warn .gt{color:var(--wn)}
#s2c .glow-none .gt,#s2c .glow-pick .gt{color:var(--ink2)}
#s2c .glow-none,#s2c .glow-pick{border-color:var(--ln);background:var(--sf2)}
#s2c .msg-plain{background:var(--sf2);border-color:var(--ln);color:var(--ink)}
#s2c .msg-plain b{color:var(--ink)}
#s2c .tagplain{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
 padding:3px 8px;border-radius:4px;border:1px solid var(--ln);background:var(--sf2);
 color:var(--ink3);white-space:nowrap}

/* ===== the lit-switch step, actually lit =====
   A CSS-drawn tail cap per card: machined ring + centre button. Each switch
   glows the way it really does — rubber over the whole face, metal at the ring,
   both when a clear centre is fitted. Colour follows the chosen LED. */
#s2c .swc{position:relative;overflow:hidden;--ledc:#7fe9c4}
#s2c .swc::before{content:"";position:absolute;inset:-40% -30% auto -30%;height:170%;
 background:radial-gradient(60% 55% at 50% 0%,color-mix(in srgb,var(--ledc,#7fe9c4) 26%,transparent),transparent 72%);
 opacity:0;transition:opacity .35s;pointer-events:none}
#s2c .swc.lit-face::before,#s2c .swc.lit-ring::before,#s2c .swc.lit-both::before{opacity:.5}
#s2c .swc[aria-pressed="true"]::before{opacity:1}
#s2c .swc>*{position:relative;z-index:1}
#s2c .tailviz{width:78px;height:78px;flex:0 0 78px;border-radius:50%;
 position:relative;align-self:center;margin-bottom:6px;
 background:radial-gradient(circle at 34% 28%,#3a444e,#161c22 62%,#0b1116);
 box-shadow:inset 0 2px 3px rgba(255,255,255,.14),inset 0 -5px 9px rgba(0,0,0,.65),0 3px 10px rgba(0,0,0,.5)}
#s2c .tv-ring,#s2c .tv-mid{position:absolute;border-radius:50%;transition:box-shadow .3s,background .3s}
#s2c .tv-ring{inset:9px}
#s2c .tv-mid{inset:26px;background:#2a333c;box-shadow:inset 0 2px 3px rgba(255,255,255,.12)}
/* rubber: the whole face lights */
#s2c .tv-face .tv-ring{background:radial-gradient(circle,var(--ledc) 0%,color-mix(in srgb,var(--ledc) 55%,transparent) 70%,transparent 100%);
 box-shadow:0 0 20px 5px color-mix(in srgb,var(--ledc) 62%,transparent);animation:s2pulse 2.8s ease-in-out infinite}
#s2c .tv-face .tv-mid{background:color-mix(in srgb,var(--ledc) 78%,#fff 12%);
 box-shadow:0 0 16px 3px color-mix(in srgb,var(--ledc) 60%,transparent)}
/* metal: the clear outer ring lights, centre stays solid */
#s2c .tv-ring .tv-ring{display:none}
#s2c .tv-ring2{display:none}
#s2c .tailviz.tv-ring .tv-ring{border:5px solid var(--ledc);background:transparent;
 box-shadow:0 0 18px 3px color-mix(in srgb,var(--ledc) 58%,transparent),
 inset 0 0 12px color-mix(in srgb,var(--ledc) 45%,transparent);animation:s2pulse 2.8s ease-in-out infinite}
/* metal + clear centre: ring AND middle light */
#s2c .tailviz.tv-both .tv-ring{border:5px solid var(--ledc);background:transparent;
 box-shadow:0 0 20px 4px color-mix(in srgb,var(--ledc) 62%,transparent),
 inset 0 0 14px color-mix(in srgb,var(--ledc) 50%,transparent);animation:s2pulse 2.8s ease-in-out infinite}
#s2c .tailviz.tv-both .tv-mid{background:radial-gradient(circle,#fff 0%,var(--ledc) 62%);
 box-shadow:0 0 18px 4px color-mix(in srgb,var(--ledc) 70%,transparent)}
/* forward clicky: dark, deliberately */
#s2c .tailviz.tv-off .tv-ring{border:5px solid #313b45;background:transparent}
@keyframes s2pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
/* LED colour swatches show the actual glow */
#s2c .ledopt{--ledc:#7fe9c4}
#s2c .leddot{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--ledc);
 box-shadow:0 0 12px 2px color-mix(in srgb,var(--ledc) 65%,transparent),inset 0 -3px 5px rgba(0,0,0,.35)}
#s2c .ledopt[aria-pressed="true"] .leddot{box-shadow:0 0 20px 5px color-mix(in srgb,var(--ledc) 80%,transparent),
 inset 0 -3px 5px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){
  #s2c .tv-face .tv-ring,#s2c .tailviz.tv-ring .tv-ring,#s2c .tailviz.tv-both .tv-ring{animation:none}
}

/* IR reads as a bar; Mystery is centred */
#s2c .pgrid-bar{grid-template-columns:1fr 1fr}
@media(max-width:720px){#s2c .pgrid-bar{grid-template-columns:1fr}}
#s2c .pgrid-center{grid-template-columns:minmax(260px,420px);justify-content:center}
#s2c .pgrid-center .pick{justify-content:center;text-align:center}
/* previews sit identically in every card, whatever the text above them */
#s2c .tailviz{display:block;margin:2px auto 12px;align-self:auto}
#s2c .swc{align-items:stretch}
/* metal never looks dead: faint centre sheen even before a button is picked */
#s2c .tailviz.tv-ring .tv-mid{background:radial-gradient(circle at 50% 38%,#3d474f,#232b33 70%);
 box-shadow:inset 0 2px 3px rgba(255,255,255,.13),0 0 10px color-mix(in srgb,var(--ledc) 22%,transparent)}
/* tooltip replaces the old overlay badge */
#s2c .hastip{position:relative}
#s2c .hastip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);
 transform:translateX(-50%);width:max-content;max-width:240px;padding:10px 12px;border-radius:8px;
 background:#05090d;color:var(--ink);border:1px solid var(--acl);font-size:14px;font-weight:500;
 line-height:1.4;opacity:0;visibility:hidden;transition:opacity .15s;z-index:20;pointer-events:none;
 box-shadow:0 8px 22px rgba(0,0,0,.6)}
#s2c .hastip:hover::after,#s2c .hastip:focus-visible::after{opacity:1;visibility:visible}
/* pocket clip */
#s2c .clipopt{align-items:flex-start}
#s2c .clipd{display:block;font-size:14.5px;font-weight:400;color:var(--ink3);margin-top:4px;line-height:1.45}
#s2c .clipno{border-style:dashed}
/* name-this-build, now at the top */
#s2c .namebox{margin-bottom:24px;padding:20px 22px;border:2px solid var(--acl);border-radius:10px;
 background:var(--acs)}
#s2c .namebox label{display:block;font-size:22px;font-weight:800;margin-bottom:6px}
#s2c .namebox p{font-size:16px;color:var(--ink2);line-height:1.5;margin-bottom:14px;max-width:70ch}
#s2c .namebox input{width:100%;max-width:520px;padding:14px 16px;font:inherit;font-size:18px;
 border-radius:8px;background:var(--bg);border:2px solid var(--ln);color:var(--ink)}
#s2c .namebox input:focus{outline:none;border-color:var(--ac)}
#s2c .namebox .buildtag{margin-top:14px}

/* ===== tail-cap previews, rebuilt =====
   Metal illuminated is a MACHINED METAL cap: a glowing translucent ring set
   into dark metal, with a solid metal centre button. The centre only lights
   when a clear button is fitted. Rubber is one soft lens across the face. */

function goesWith(){

function cartItems(){
  var tag=buildTag(), gw=goesWith();
  /* Properties beginning with "_" are hidden from the customer in cart/checkout but
     stay visible on the order in admin. _gc_build is the grouping key the cart
     template uses to draw one build as a single block. */
  return lines().filter(function(l){return l.vid&&!l.oos}).map(function(l){
    var p=l.props?JSON.parse(JSON.stringify(l.props)):{};
    p["_gc_build"]=tag||"Custom build";
    p["_gc_light"]=gw||"";
    p["_gc_role"]=l.role||"";
    if(l.role!=="The light"&&l.role)p["Part"]=l.role;
    var o={id:Number(l.vid),quantity:1};
    if(Object.keys(p).length)o.properties=p;

/* Build is ready to buy when nothing is still pending a choice. */
function ready(){
  var L=lines(); if(!L.length)return false;
  for(var i=0;i<L.length;i++){ if(L[i].pend||!L[i].vid)return false }
  if(S.host&&S.host.v==="full"&&!S.sw)return false;   /* full hosts must resolve the switch step */
  if(!S.em)return false;
  if(!S.refl)return false;
  if(!S.optic)return false;
  if(!S.clip)return false;   /* 'No thanks' counts as answered */
  if(!S.ack)return false;
  if(S.host&&S.host.oos)return false;

  var y=node.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop)-84;

    String(S.nick||'').replace(/"/g,'&quot;')+'">'+
    '</div>';
  R.innerHTML=intro+'<div class="steps">'+out+'</div>'+
    '<div class="bar'+(L.length?' on':'')+'"><div class="barin"><div class="bartxt">'+
    (rdy?'<b>'+L.length+' item'+(L.length>1?'s':'')+' ready</b><span>Total shown at checkout</span>'
        :'<b>Keep going</b><span>'+(!h?'Pick your light to start':'Finish the highlighted step')+'</span>')+
    '</div>'+(rdy?'<button class="cta" type="button" id="addcart">Add to cart &rarr;</button>'
        :'<button class="cta" type="button" disabled>Add to cart</button>')+'</div></div>';
  wire();
  var ac=document.getElementById('addcart');
  if(ac)ac.addEventListener('click',function(){
    ac.disabled=true;ac.textContent='Adding…';
    fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items:cartItems()})})
      .then(function(r){if(!r.ok)throw 0;bumpBuildNo();window.location='/cart'})
      .catch(function(){ /* fallback: permalink (drops the emitter note) */
        var u=cartUrl(); if(u)window.location=u;
        else{ac.disabled=false;ac.textContent='Add to cart →'} });
  });
}
function wire(){
  R.querySelectorAll('[data-h]').forEach(function(b){b.addEventListener('click',function(){
    var n=HOSTS.filter(function(x){return x.id===b.dataset.h})[0];
    S.host=(S.host&&S.host.id===n.id)?null:n;
    S.em=null;S.refl=null;S.optic=null;S.beamOK=false;S.clip=null;S.presslit=false;S.ack=false;S.sw=null;S.led=null;S.btn=null;
    render(); if(S.host)goTo(stepEl(2))})});
  R.querySelectorAll('[data-em]').forEach(function(b){b.addEventListener('click',function(){
    var v=b.dataset.em;
    if(S.em===v){S.em=null;S.refl=null;S.optic=null;}
    else{S.em=v;S.refl=suggestRefl(v);S.optic=OPTICS[0];}
    render(); if(S.em)goTo(stepEl(3))})});   /* land ON the beam step, not past it */
  R.querySelectorAll('[data-refl]').forEach(function(b){b.addEventListener('click',function(){
    S.refl=b.dataset.refl; render()})});
  R.querySelectorAll('[data-optic]').forEach(function(b){b.addEventListener('click',function(){
    S.optic=b.dataset.optic; render()})});
  var mo=document.getElementById('moreoptics');
  if(mo)mo.addEventListener('click',function(){S.showOptics=!S.showOptics;render();goTo(stepEl(3))});
  var pl=document.getElementById('presslit');
  if(pl)pl.addEventListener('click',function(){
    S.presslit=!S.presslit;
    if(S.presslit){ S.sw=SWITCHES.filter(function(s){return s.id==='metal'})[0];
                    S.btn=BTN.cols.filter(function(c){return c[0]==='Clear Plastic'})[0]; }
    else { S.sw=null;S.led=null;S.btn=null; }
    render(); goTo(stepEl(S.presslit?5:4))});
  R.querySelectorAll('[data-clip]').forEach(function(b){b.addEventListener('click',function(){
    var cl=CLIPS.filter(function(x){return x.k===b.dataset.clip})[0];
    S.clip=(S.clip&&S.clip.k===cl.k)?null:cl; render(); if(S.clip)goTo(stepEl(8))})});
  var nk=document.getElementById('nick');
  if(nk)nk.addEventListener('input',function(){S.nick=nk.value});
  var ak=document.getElementById('ack');
  if(ak)ak.addEventListener('change',function(){S.ack=ak.checked;render()});
  R.querySelectorAll('[data-sw]').forEach(function(b){b.addEventListener('click',function(){
    var n=SWITCHES.filter(function(x){return x.id===b.dataset.sw})[0];
    S.sw=(S.sw&&S.sw.id===n.id)?null:n; S.led=null; if(!takesButton())S.btn=null; render();
    var nx=R.querySelector('.stp[data-s="active"]'); if(nx)nx.scrollIntoView({behavior:'smooth',block:'center'})})});
  R.querySelectorAll('[data-led]').forEach(function(b){b.addEventListener('click',function(){
    var c=S.sw.cols.filter(function(x){return x[0]===b.dataset.led})[0];
    S.led=(S.led&&S.led[0]===c[0])?null:c; render(); if(S.led&&takesButton())goTo(stepEl(6))})});
  R.querySelectorAll('[data-btn]').forEach(function(b){b.addEventListener('click',function(){
    var k=b.dataset.btn,c;
    if(k==='Brass')c=['Brass',BRASSBTN.sw,BRASSBTN.vid,false];
    else c=btnSet().cols.filter(function(x){return x[0]===k})[0];
    S.btn=(S.btn&&S.btn[0]===c[0])?null:c; render()})});
}
render();

</script>
