<style>
#s2c{--bg:#070d13;--sf:#0d151d;--sf2:#141f2a;--ln:#243543;
 --ink:#f3f7fa;--ink2:#adbecb;--ink3:#8194a3;
 --ac:#9aa8ff;--acs:#181e38;--acl:#4a5286;
 --ok:#00ff9f;--okb:#052a20;--okl:#16785a;
 --no:#ff5c86;--nob:#2e0f1c;--nol:#84294a;
 --wn:#ffb84d;--wnb:#2e2209;--wnl:#7f5c1c;

 color:var(--ink);line-height:1.5;display:block;text-align:left;font-size:18px;padding-bottom:120px}
#s2c *{box-sizing:border-box}
@media(min-width:1000px){#s2c{width:min(1180px,94vw);margin-left:calc(50% - min(590px,47vw))}}
#s2c h3{margin:0;color:var(--ink)}#s2c p{margin:0;color:var(--ink)}
#s2c a{color:var(--ac);text-decoration:none}
#s2c .steps{display:flex;flex-direction:column;gap:16px}
/* step shell */
#s2c .stp{border:2px solid var(--ln);border-radius:10px;background:var(--sf);overflow:hidden;
 transition:opacity .2s,border-color .2s,filter .2s}
#s2c .stp[data-s="lock"]{opacity:.32;filter:grayscale(.55);pointer-events:none}
#s2c .stp[data-s="active"]{border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
#s2c .stp[data-s="done"]{border-color:var(--okl)}
#s2c .sh{display:flex;align-items:center;gap:14px;padding:18px 22px;background:var(--sf2);
 border-bottom:2px solid var(--ln)}
#s2c .stp[data-s="active"] .sh{background:var(--acs);border-bottom-color:var(--acl)}
#s2c .stp[data-s="done"] .sh{background:var(--okb);border-bottom-color:var(--okl)}
#s2c .sn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;
 font-family:var(--mono);font-size:19px;font-weight:800;background:var(--ln);color:var(--ink2)}
#s2c .stp[data-s="active"] .sn{background:var(--ac);color:#070d13}
#s2c .stp[data-s="done"] .sn{background:var(--ok);color:#070d13}
#s2c .sn svg{width:22px;height:22px}
#s2c .sh h3{font-size:22px;font-weight:800;letter-spacing:-.015em;flex:1;line-height:1.15}
#s2c .snote{font-family:var(--mono);font-size:14px;color:var(--ink3);text-align:right;max-width:44%}
#s2c .stp[data-s="done"] .snote{color:var(--ok)}
#s2c .sb{padding:22px}
#s2c .lede{font-size:17px;color:var(--ink2);line-height:1.55}
#s2c .lede b{color:var(--ink)}
#s2c .grp{margin-bottom:20px}#s2c .grp:last-child{margin-bottom:0}
#s2c .grpt{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--ink3);padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--ln)}
#s2c .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
#s2c .pgrid-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
#s2c .pgrid-s{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
/* pickable */
#s2c .pick{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:14px 16px;
 background:var(--bg);border:2px solid var(--ln);border-radius:8px;cursor:pointer;font:inherit;
 font-size:17px;font-weight:700;color:var(--ink);text-align:left;transition:border-color .13s,transform .13s,background .13s}
#s2c .pick:hover{border-color:var(--ac);background:var(--sf2);transform:translateY(-2px)}
#s2c .pick:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
#s2c .pick[aria-pressed="true"]{border-color:var(--ac);background:var(--acs);box-shadow:inset 0 0 0 2px var(--ac)}
#s2c .pick[data-oos]{opacity:.5}
#s2c .host{flex-wrap:wrap;row-gap:8px;align-items:center;min-height:78px}
#s2c .host .chip{order:1}
#s2c .host .pn{order:2;flex:1 1 calc(100% - 44px);font-size:16px}
#s2c .host .pp{order:3;flex:0 0 auto}
#s2c .host .cap{order:4;margin-left:auto;flex:0 0 auto}
#s2c .chip{width:30px;height:30px;flex:0 0 30px;border-radius:6px;border:1px solid rgba(175,190,205,.38);
 box-shadow:inset 0 -7px 11px -6px rgba(0,0,0,.7)}
#s2c .chip-x{background:var(--sf2)}
#s2c .pn{flex:1;min-width:0;line-height:1.25}
#s2c .pn em{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--wn)}
#s2c .pp{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink3)}
#s2c .cap{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
 padding:3px 7px;border-radius:4px;border:1px solid;white-space:nowrap}
#s2c .cap-full{color:var(--ok);border-color:var(--okl);background:var(--okb)}
#s2c .cap-center{color:var(--wn);border-color:var(--wnl);background:var(--wnb)}
#s2c .cap-unknown{color:var(--no);border-color:var(--nol);background:var(--nob)}
#s2c .star{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
 padding:3px 7px;border-radius:4px;background:var(--ok);color:#070d13;font-weight:800;white-space:nowrap}
#s2c .opt-star{border-color:var(--okl)}
#s2c .star-off{background:var(--wnb);color:var(--wn);border:1px solid var(--wnl)}
/* switch cards */
#s2c .swc{flex-direction:column;align-items:stretch;gap:9px;min-height:0;padding:18px}
#s2c .swn{font-size:21px;font-weight:800;line-height:1.15}
#s2c .swp{font-family:var(--mono);font-size:23px;font-weight:800;color:var(--ok)}
#s2c .swt{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
 text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid}
#s2c .swt.lit{color:var(--ac);border-color:var(--acl);background:var(--acs)}
#s2c .swt.nolit{color:var(--ink3);border-color:var(--ln);background:var(--sf2)}
#s2c .swd{font-size:15px;font-weight:400;color:var(--ink2);line-height:1.45}
#s2c .swa{font-family:var(--mono);font-size:12.5px;font-weight:400;color:var(--ink3);
 padding-top:10px;border-top:1px solid var(--ln)}
/* messages */
#s2c .msg{display:flex;gap:13px;padding:16px 18px;border-radius:8px;border:1px solid;margin-bottom:16px;
 font-size:16px;line-height:1.5}
#s2c .msg svg{width:24px;height:24px;flex:0 0 24px;margin-top:2px}
#s2c .msg>div>b:first-child{display:block;margin-bottom:4px}
#s2c .msg p{font-size:15.5px;color:var(--ink2)}
#s2c .msg-warn{background:var(--wnb);border-color:var(--wnl);color:var(--wn)}
#s2c .msg-rule{background:var(--acs);border-color:var(--acl);color:var(--ac)}
#s2c .msg-dc{background:var(--okb);border-color:var(--okl);color:var(--ok)}
/* glow readout */
#s2c .glow{border:2px solid var(--ln);border-radius:8px;padding:20px;margin-bottom:18px;background:var(--bg)}
#s2c .gt{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-bottom:8px}
#s2c .glow p{font-size:16px;color:var(--ink2);line-height:1.5}
#s2c .glow-double{border-color:var(--ok);background:var(--okb);box-shadow:0 0 0 4px rgba(0,255,159,.08)}
#s2c .glow-double .gt{color:var(--ok)}
#s2c .glow-face .gt{color:var(--ac)}#s2c .glow-face{border-color:var(--acl);background:var(--acs)}
#s2c .glow-edge .gt{color:var(--wn)}#s2c .glow-edge{border-color:var(--wnl);background:var(--wnb)}
#s2c .glow-none .gt,#s2c .glow-pick .gt{color:var(--ink2)}
/* parts */
#s2c .parts{display:flex;flex-direction:column;gap:9px}
#s2c .part{display:flex;align-items:center;gap:13px;padding:15px 16px;background:var(--bg);
 border:1px solid var(--ln);border-radius:8px;font-size:17px;font-weight:600;color:var(--ink);
 transition:border-color .13s}
#s2c .part:hover{border-color:var(--ok)}
#s2c .part .pp{color:var(--ok);font-size:18px}
#s2c .fine{font-size:14.5px;color:var(--ink3);margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)}
/* board columns */
#s2c .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:880px){#s2c .cols2{grid-template-columns:1fr}}
#s2c .cw{border:2px solid var(--ln);border-radius:9px;overflow:hidden;margin-bottom:14px}
#s2c .cw-full{border-color:var(--okl)}#s2c .cw-center{border-color:var(--wnl)}
#s2c .cw-unknown{border-color:var(--nol)}
#s2c .cwh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
 font-size:19px;font-weight:800}
#s2c .cw-full .cwh{background:var(--okb);color:var(--ok)}
#s2c .cw-center .cwh{background:var(--wnb);color:var(--wn)}
#s2c .cw-unknown .cwh{background:var(--nob);color:var(--no)}
#s2c .cwh span{font-family:var(--mono);font-size:28px}
#s2c .cwl{padding:12px;display:flex;flex-direction:column;gap:9px}
/* sticky cart bar */
#s2c .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(7,13,19,.96);
 border-top:2px solid var(--ln);padding:14px 20px;z-index:90;transform:translateY(110%);
 transition:transform .25s;backdrop-filter:blur(8px)}
#s2c .bar.on{transform:none}
#s2c .barin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
#s2c .bartxt{flex:1;min-width:170px;line-height:1.25}
#s2c .bartxt b{display:block;font-size:19px;font-weight:800}
#s2c .bartxt span{font-size:14px;color:var(--ink3);font-family:var(--mono)}
#s2c .cta{font:inherit;font-size:19px;font-weight:800;padding:16px 32px;border-radius:8px;border:none;
 background:var(--ok);color:#070d13;cursor:pointer;text-decoration:none;display:inline-block;
 transition:opacity .13s}
#s2c .cta:hover{opacity:.87;text-decoration:none}
#s2c .cta:disabled{background:var(--ln);color:var(--ink3);cursor:not-allowed}
#s2c .cta:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
@media(prefers-reduced-motion:reduce){#s2c *{transition:none!important}}

#s2c .stp:first-child .sb{padding:18px}
#s2c .cwl .pick{background:var(--sf)}
</style>
<div id="s2c">
<div class="hero"><div class="kick" style="font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ok);margin-bottom:12px">// Convoy S2+ · Switch &amp; button builder</div><h2 style="font-size:clamp(30px,5.2vw,46px);line-height:1.05;letter-spacing:-.03em;font-weight:800;margin:0 0 14px">Find your light, then build the switch</h2><p style="font-size:19px;color:var(--ink2);max-width:62ch;margin:0 0 28px">Your finish decides everything. Find it in the correct column below and the rest of the build unlocks.</p></div>
<div id="s2c-app"></div>
</div>

{id:"tigc",n:"Ti Gold Circuit",g:"Titanium",v:"full",sw:"#8d7a3f",h:"convoy-s2-18650-titanium-ti-flashlight-specialty-finishes",vid:"49975294361915",p:69.99},

{id:"tisp",n:"Ti Multi-Color Spatter",g:"Titanium",v:"center",sw:"#6b6f7d",h:"convoy-s2-18650-titanium-ti-flashlight-specialty-finishes",vid:"49975294427451",p:69.99},
{id:"tigrc",n:"Ti Green Circuit (LE)",g:"Titanium",v:"center",sw:"#4d6b52",h:"convoy-s2-18650-titanium-ti-flashlight-green-circuit-limited-edition",vid:"50076839739707",p:69.99,oos:true},

var SWITCHES=[
{id:"rubber",n:"Rubber Illuminated",h:"convoy-illuminated-tail-switch-button-rubber",p:3.99,lit:true,takesButton:false,
 pitch:"Rubber diffuses the LED, so the whole face glows. The brightest of the three.",
 act:"Reverse clicky — full click on, tap to change modes",
 cols:[["Orange","#c25a1c","47828135936315",3.99],["Blue","#20509a","47828135969083",3.99],["Green","#1f6b3a","47828136001851",3.99],["Red","#9c2420","47828136034619",3.99],["Purple","#5b3a8e","50601740108091",3.99],["Pink","#c96792","50601738961211",3.99],["White","#e8e8e6","50601739813179",3.99],["RGB Slow Fade",RGBSW,"47828136067387",4.99]]},
{id:"metal",n:"Metal Illuminated",h:"convoy-s2-illuminated-tail-switch-button",p:4.99,lit:true,takesButton:true,
 pitch:"Machined metal ring with a separate centre button you choose below. This is the one that can do Double Clear.",
 act:"Reverse clicky — full click on, tap to change modes",
 cols:[["Orange","#c25a1c","44909394493755",4.99],["Blue","#20509a","44909394526523",4.99],["Green","#1f6b3a","45259730878779",4.99],["Red","#9c2420","45259754471739",4.99],["Purple","#5b3a8e","50601834479931",4.99],["Pink","#c96792","50601833726267",4.99],["White","#e8e8e6","50601834086715",4.99],["RGB Slow Fade",RGBSW,"45259764072763",5.25]]},
{id:"forward",n:"Forward Clicky",h:"convoy-forward-clicky-switch-for-s2-full-pcb-assembly",p:1.99,lit:false,takesButton:false,
 pitch:"Momentary signalling without committing the light on. Cannot be illuminated — no illuminated forward clicky exists.",
 act:"Half-press for momentary on, full click to stay on",cols:[]}
];
/* Any metal button can be replaced with this product. "Clear Plastic" is the Double Clear part. */
var BTN={h:"convoy-black-button-for-metal-illuminated-switch",p:0.99,
 cols:[["Clear Plastic","#dfe4e6","50903798841659",true],["Silver Aluminum","#adb3b8","50903776100667",false],
 ["Black","#1e2124","50903776133435",false],["Blue","#20509a","50903776166203",false],["Cyan","#1d8f9c","50903776198971",false],
 ["Deep Green","#1f5b39","50903776231739",false],["Gray","#7c8288","50903776264507",false],["Orange","#c25a1c","50903776297275",false],
 ["Purple","#5b3a8e","50903776330043",false],["Red","#9c2420","50903776362811",false],["Tan","#a58a63","50903776395579",false]]};
var BRASSBTN={n:"Brass",h:"convoy-brass-button-for-metal-illuminated-switch",p:1.99,vid:"50709001404731",sw:"#b08d3e"};
var RUBBTN={h:"convoy-color-rubber-tail-cap-buttons-for-s2-c8-and-more",p:0.25,
 cols:[["Black","#1e2124","50300036677947"],["Orange","#c25a1c","50300036710715"],["Green (does NOT glow)","#1f6b3a","50300036743483"],["Blue (glow)","#20509a","50300036776251"],["Translucent / White","#e8e8e6","50300036809019"]]};

/* ---------------- rule engine ---------------- */
var S={host:null,sw:null,led:null,btn:null};
function money(n){return "$"+n.toFixed(2)}
function purl(h){return P+h}
function canonCount(v){var s={},k;HOSTS.forEach(function(h){if(h.v===v)s[h.canon||h.id]=1});
  k=0;for(var x in s)k++;return k}
/* Does the CURRENT build take a separate centre button?
   - full host + metal illuminated switch  -> yes (ring + centre, Double Clear possible)
   - pressure-fit host                     -> yes, centre button ONLY
   - anything else                          -> no                                */
/* Which button family this build can swap:
   'metal'  = metal centre button (metal illuminated switch, or a pressure-fit host)
   'rubber' = coloured rubber tailcap button (rubber illuminated switch)
   false    = none (forward clicky, or nothing picked yet)                        */
function takesButton(){
  if(!S.host)return false;
  if(S.host.v==="center")return "metal";
  if(!S.sw)return false;
  if(S.sw.takesButton)return "metal";
  if(S.sw.id==="rubber")return "rubber";
  return false;
}
function btnSet(){return takesButton()==="rubber"?RUBBTN:BTN}
/* Rubber tailcap colours differ in how much light they pass. */
function rubberGlow(n){
  if(!n)return null;
  if(n.indexOf("does NOT glow")>-1)return "none";
  if(n.indexOf("Translucent")>-1)return "most";
  return "some";
}
function canDoubleClear(){ return !!(S.host&&S.host.v==="full"&&S.sw&&S.sw.takesButton) }
function isClear(name){ return name==="Clear Plastic" }
/* What the customer will actually SEE lit up. */
function glow(){
  if(!S.host)return null;
  if(S.host.v==="center"){
    return {k:"edge",t:"Edge glow only",
      d:"Your switch is pressed in at the factory, so the outer ring stays as it is. A new centre "+
        "button changes the look, but the light still comes from around the edge."};
  }
  if(!S.sw)return null;
  if(!S.sw.lit)return {k:"none",t:"No light",d:"The forward clicky is not illuminated. Nothing on the tail will glow."};
  if(S.sw.id==="rubber"){
    var rg=S.btn?rubberGlow(S.btn[0]):null;
    if(rg==="none")return {k:"none",t:"No glow",
      d:"That rubber button is opaque — it does not glow. Pick translucent or another colour if you "+
        "want to be able to find the light in the dark."};
    if(rg==="most")return {k:"double",t:"Brightest glow",
      d:"Translucent rubber passes the most light of any button. The easiest option to spot in a dark room."};
    if(rg==="some")return {k:"face",t:"Full face glow",
      d:"A coloured rubber button glows across its whole face, tinted to match. Darker colours pass "+
        "less light than translucent."};
    return {k:"face",t:"Full face glow",
      d:"Rubber diffuses the LED across the whole button — more light than the metal switch."};
  }
  if(!S.btn)return {k:"pick",t:"Pick a centre button",
    d:"The metal switch needs a centre button. Clear Plastic gives you Double Clear; anything else glows at the edge only."};
  if(isClear(S.btn[0]))return {k:"double",t:"DOUBLE CLEAR",
    d:"Clear outer ring and clear centre button — both light up. Because you are buying the metal "+
      "switch together with the light, this is the lit-up Double Clear."};
  return {k:"edge",t:"Edge glow only",
    d:"A "+S.btn[0]+" centre button blocks the middle, so you get glow around the edge — exactly like "+
      "the silver or black buttons."};
}
/* Everything currently in the build, in cart order. */
function lines(){
  var L=[];
  if(S.host)L.push({n:"Convoy S2+ — "+S.host.n,p:S.host.p,vid:S.host.vid,h:S.host.h,sw:S.host.sw,oos:!!S.host.oos});
  if(S.host&&S.host.v==="full"&&S.sw){
    var p=S.sw.p,vid=null;
    if(S.sw.cols.length){ if(S.led){p=S.led[3];vid=S.led[2];} }
    else vid="50172242526523";
    L.push({n:S.sw.n+(S.led?" — "+S.led[0]:""),p:p,vid:vid,h:S.sw.h,sw:null,
            pend:(S.sw.cols.length&&!S.led)});
  }
  if(S.btn){
    var fam=takesButton(),isBrass=S.btn[0]==="Brass";
    L.push({n:(fam==="rubber"?"Rubber button — ":"Centre button — ")+S.btn[0],
            p:isBrass?BRASSBTN.p:(fam==="rubber"?RUBBTN.p:BTN.p),vid:S.btn[2],
            h:isBrass?BRASSBTN.h:(fam==="rubber"?RUBBTN.h:BTN.h),sw:S.btn[1]});
  }
  return L;
}
function cartUrl(){
  if(!ready())return null;
  var v=lines().filter(function(l){return l.vid&&!l.oos}).map(function(l){return l.vid+":1"});
  return v.length?SHOP+"/cart/"+v.join(","):null;
}
/* Build is ready to buy when nothing is still pending a choice. */
function ready(){
  var L=lines(); if(!L.length)return false;
  for(var i=0;i<L.length;i++){ if(L[i].pend||!L[i].vid)return false }
  if(S.host&&S.host.v==="full"&&!S.sw)return false;
  if(S.host&&S.host.v==="unknown")return false;
  if(S.host&&S.host.oos)return false;
  return true;
}
/* ---- shared UI: progressive steps, dim what is not available yet ---- */
var ICO={ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>'};
var R=document.getElementById(ROOT);
function el(t){var d=document.createElement('div');d.innerHTML=t;return d}
function step(n,title,state,note,inner){
  return '<section class="stp" data-s="'+state+'"><div class="sh"><span class="sn">'+
   (state==='done'?ICO.ok:state==='lock'?ICO.lock:n)+'</span><h3>'+title+'</h3>'+
   (note?'<span class="snote">'+note+'</span>':'')+'</div><div class="sb">'+inner+'</div></section>';
}
function hostBtn(h,extra){
  return '<button class="pick host'+(extra||'')+'" type="button" data-h="'+h.id+'" aria-pressed="'+
   (S.host&&S.host.id===h.id)+'"'+(h.oos?' data-oos="1"':'')+'>'+
   '<span class="chip" style="background:'+h.sw+'"></span>'+
   '<span class="pn">'+h.n+(h.oos?' <em>sold out</em>':'')+'</span>'+
   '<span class="cap cap-'+h.v+'">'+(h.v==='full'?'Full switch':h.v==='center'?'Centre only':'Ask us')+'</span></button>';
}
function optBtn(cls,label,swatch,pressed,data,badge){
  return '<button class="pick '+cls+'" type="button" '+data+' aria-pressed="'+pressed+'">'+
   (swatch?'<span class="chip" style="background:'+swatch+'"></span>':'')+
   '<span class="pn">'+label+'</span>'+(badge||'')+'</button>';
}
function render(){
  var out='',h=S.host,g=glow();
  /* ---- 1. the light ---- */
  var groups=[];HOSTS.forEach(function(x){if(groups.indexOf(x.g)<0)groups.push(x.g)});
  var inner='';
  if(SKIN==='board'){
    inner='<div class="cols2">'+
     ['full','center'].map(function(v){
      var list=HOSTS.filter(function(x){return x.v===v});
      return '<div class="cw cw-'+v+'"><div class="cwh"><b>'+(v==='full'?'Whole switch swaps':'Centre button only')+
       '</b><span>'+canonCount(v)+'</span></div><div class="cwl">'+list.map(function(x){return hostBtn(x)}).join('')+
       '</div></div>'}).join('')+'</div>'+
     '<div class="cw cw-unknown"><div class="cwh"><b>Not documented</b><span>'+canonCount('unknown')+'</span></div>'+
     '<div class="cwl">'+HOSTS.filter(function(x){return x.v==='unknown'}).map(function(x){return hostBtn(x)}).join('')+'</div></div>';
  }else{
    inner=groups.map(function(gr){
      return '<div class="grp"><div class="grpt">'+gr+'</div><div class="pgrid">'+
       HOSTS.filter(function(x){return x.g===gr}).map(function(x){return hostBtn(x)}).join('')+'</div></div>'}).join('');
  }
  out+=step(1,'Pick your light',h?'done':'active',h?h.n:'Start here',
    '<p class="lede">Every answer below depends on this. <b>'+canonCount('full')+
    '</b> finishes let you change the whole tail switch; <b>'+canonCount('center')+
    '</b> are pressed in at the factory and only take a new centre button.</p>'+inner);

  /* ---- 2. the switch ---- */
  var s2state = !h?'lock':(h.v==='full'?(S.sw?'done':'active'):'lock');
  var s2note = !h?'Pick a light first':(h.v==='center'?'Not available on this finish':(S.sw?S.sw.n:''));
  var s2inner;
  if(!h){ s2inner='<p class="lede">Choose your light above and this unlocks.</p>' }
  else if(h.v==='center'){
    s2inner='<div class="msg msg-warn">'+ICO.warn+'<div><b>The '+h.n+' switch does not come out.</b>'+
     '<p>It is pressed into the tail cap at the factory. You cannot fit a different switch — but you '+
     '<b>can</b> still change the centre button in step 4.</p></div></div>';
  }else if(h.v==='unknown'){
    s2inner='<div class="msg msg-warn">'+ICO.warn+'<div><b>We have not verified the '+h.n+'.</b>'+
     '<p>It appears on neither compatibility list. Message us before buying a switch and we will open one.</p></div></div>';
  }else{
    s2inner='<div class="msg msg-rule">'+ICO.warn+'<div><b>Pick one — they are mutually exclusive.</b>'+
     '<p>There is no illuminated forward clicky. Momentary operation means giving up the glowing tail.</p></div></div>'+
     '<div class="pgrid pgrid-3">'+SWITCHES.map(function(sw){
       return '<button class="pick swc" type="button" data-sw="'+sw.id+'" aria-pressed="'+(S.sw&&S.sw.id===sw.id)+'">'+
        '<span class="swn">'+sw.n+'</span>'+
        '<span class="swt '+(sw.lit?'lit':'nolit')+'">'+(sw.lit?'Lights up':'No light')+'</span>'+
        '<span class="swd">'+sw.pitch+'</span><span class="swa">'+sw.act+'</span></button>'}).join('')+'</div>';
  }
  if(h&&h.v==='unknown')s2state='lock';
  out+=step(2,'Pick your switch',s2state,s2note,s2inner);

  /* ---- 3. LED colour ---- */
  var needLed = !!(h&&h.v==='full'&&S.sw&&S.sw.cols.length);
  var s3state = needLed?(S.led?'done':'active'):'lock';
  var s3note = needLed?(S.led?S.led[0]:'Choose a colour'):(S.sw&&!S.sw.lit?'Forward clicky has no LED':'Pick a switch first');
  var s3inner = needLed
    ? '<div class="msg msg-rule">'+ICO.warn+'<div><b>This glow is for finding the light in the dark.</b>'+
      '<p>The lit tail is a locator, not a light source &mdash; it marks where the flashlight is on a '+
      'bedside table or in a bag. It does not light the room. Some colours read brighter than others: '+
      'white and translucent show most, deeper colours least.</p></div></div>'+
      '<div class="pgrid pgrid-s">'+S.sw.cols.map(function(c){
        return optBtn('opt',c[0],c[1],(S.led&&S.led[0]===c[0]),'data-led="'+c[0]+'"','')}).join('')+'</div>'
    : '<p class="lede">'+(S.sw&&!S.sw.lit?'The forward clicky is not illuminated, so there is no LED colour to pick.'
        :'Pick an illuminated switch above and the colours unlock.')+'</p>';
  out+=step(3,'Pick the LED colour',s3state,s3note,s3inner);

  /* ---- 4. button (metal centre, or coloured rubber tailcap) ---- */
  var fam=takesButton();
  var s4state = fam?(S.btn?'done':'active'):'lock';
  var s4title = fam==='rubber'?'Pick the rubber button':'Pick the centre button';
  var s4note = fam?(S.btn?S.btn[0]:'Optional'):'Not available on this build';
  var s4inner;
  if(!fam){
    s4inner='<p class="lede">'+(!h?'Pick a light first.':
      S.sw&&S.sw.id==='forward'?'The forward clicky has no illuminated button to swap.':
      'Pick a switch above and the buttons unlock.')+'</p>';
  }else if(fam==='rubber'){
    s4inner='<div class="msg msg-rule">'+ICO.warn+'<div><b>Optional &mdash; your switch already ships with a button.</b>'+
     '<p>These swap the rubber tailcap for a different colour. How much they glow varies a lot: '+
     '<b>Translucent / White</b> passes the most light, and <b>Green does not glow at all</b>.</p></div></div>'+
     '<div class="pgrid pgrid-s">'+RUBBTN.cols.map(function(c){
       var g=rubberGlow(c[0]);
       return optBtn('opt'+(g==='most'?' opt-star':''),c[0],c[1],(S.btn&&S.btn[0]===c[0]),
         'data-btn="'+c[0]+'"',
         g==='most'?'<span class="star">Brightest</span>':
         g==='none'?'<span class="star star-off">No glow</span>':'')}).join('')+'</div>';
  }else{
    var dc=canDoubleClear();
    s4inner=(dc?'<div class="msg msg-dc"><div><b>Double Clear is available on this build.</b>'+
      '<p>Pick <b>Clear Plastic</b> and you get a clear outer ring <i>and</i> a clear centre &mdash; both light up. '+
      'Any other colour blocks the middle and glows at the edge only, exactly like silver or black.</p></div></div>'
      :'<div class="msg msg-warn">'+ICO.warn+'<div><b>Centre button only.</b>'+
      '<p>The factory ring stays put on this finish, so you get glow around the edge whichever colour you pick. '+
      'Double Clear needs a finish that takes the whole switch.</p></div></div>')+
     '<div class="pgrid pgrid-s">'+BTN.cols.map(function(c){
       var isC=c[3]&&dc;
       return optBtn('opt'+(isC?' opt-star':''),c[0],c[1],(S.btn&&S.btn[0]===c[0]),
         'data-btn="'+c[0]+'"',isC?'<span class="star">Double Clear</span>':'')}).join('')+
       optBtn('opt',BRASSBTN.n,BRASSBTN.sw,(S.btn&&S.btn[0]==='Brass'),'data-btn="Brass"','')+'</div>';
  }
  out+=step(4,s4title,s4state,s4note,s4inner);

  /* ---- 5. result ---- */
  var L=lines(),rdy=ready();
  var res='';
  if(g)res+='<div class="glow glow-'+g.k+'"><div class="gt">'+g.t+'</div><p>'+g.d+'</p></div>';
  else res+='<p class="lede">Your result appears here as you build.</p>';
  if(L.length){
    res+='<div class="parts">'+L.map(function(l){
      return '<a class="part" href="'+purl(l.h)+'" target="_blank" rel="noopener">'+
       (l.sw?'<span class="chip" style="background:'+l.sw+'"></span>':'<span class="chip chip-x"></span>')+
       '<span class="pn">'+l.n+(l.pend?' <em>— choose a colour</em>':'')+(l.oos?' <em>— sold out</em>':'')+'</span>'+
       '</a>'}).join('')+'</div>'+
     '<p class="fine">Emitter, reflector and lens are chosen on the S2+ product page — open the light above to pick them.</p>';
  }
  out+=step(5,'Your build',rdy?'done':(L.length?'active':'lock'),rdy?'Ready':'',res);
  R.innerHTML='<div class="steps">'+out+'</div>'+
    '<div class="bar'+(L.length?' on':'')+'"><div class="barin"><div class="bartxt">'+
    (rdy?'<b>'+L.length+' item'+(L.length>1?'s':'')+' ready</b><span>Total shown at checkout</span>'
        :'<b>Keep going</b><span>'+(!h?'Pick your light to start':'Finish the highlighted step')+'</span>')+
    '</div>'+(rdy?'<a class="cta" href="'+cartUrl()+'">Add to cart &rarr;</a>'
        :'<button class="cta" type="button" disabled>Add to cart</button>')+'</div></div>';
  wire();
}
function wire(){
  R.querySelectorAll('[data-h]').forEach(function(b){b.addEventListener('click',function(){
    var n=HOSTS.filter(function(x){return x.id===b.dataset.h})[0];
    S.host=(S.host&&S.host.id===n.id)?null:n; S.sw=null;S.led=null;S.btn=null; render();
    var nx=R.querySelector('.stp[data-s="active"]'); if(nx)nx.scrollIntoView({behavior:'smooth',block:'center'})})});
  R.querySelectorAll('[data-sw]').forEach(function(b){b.addEventListener('click',function(){
    var n=SWITCHES.filter(function(x){return x.id===b.dataset.sw})[0];
    S.sw=(S.sw&&S.sw.id===n.id)?null:n; S.led=null; if(!takesButton())S.btn=null; render();
    var nx=R.querySelector('.stp[data-s="active"]'); if(nx)nx.scrollIntoView({behavior:'smooth',block:'center'})})});
  R.querySelectorAll('[data-led]').forEach(function(b){b.addEventListener('click',function(){
    var c=S.sw.cols.filter(function(x){return x[0]===b.dataset.led})[0];
    S.led=(S.led&&S.led[0]===c[0])?null:c; render()})});
  R.querySelectorAll('[data-btn]').forEach(function(b){b.addEventListener('click',function(){
    var k=b.dataset.btn,c;
    if(k==='Brass')c=['Brass',BRASSBTN.sw,BRASSBTN.vid,false];
    else c=btnSet().cols.filter(function(x){return x[0]===k})[0];
    S.btn=(S.btn&&S.btn[0]===c[0])?null:c; render()})});
}
render();

</script>
