<style>
#s2g{
  --bg:#070d13;--surface:#0d151d;--surface-2:#131e29;--line:#22323f;
  --ink:#f2f6f9;--ink-2:#a9bac8;--ink-3:#8296a6;
  --accent:#9aa8ff;--accent-soft:#171d36;--accent-line:#454c7d;
  --pass:#00ff9f;--pass-bg:#04241c;--pass-line:#14684d;
  --block:#ff5c86;--block-bg:#2c0e1a;--block-line:#7a2846;
  --unk:#ffb84d;--unk-bg:#2c2009;--unk-line:#77551a;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  color:var(--ink);line-height:1.55;display:block;text-align:left;font-size:18px;
}
#s2g *{box-sizing:border-box}
@media (min-width:1000px){#s2g{width:min(1080px,94vw);margin-left:calc(50% - min(540px,47vw))}}
#s2g h1,#s2g h2,#s2g h3{margin:0;color:var(--ink);text-wrap:balance}
#s2g p{margin:0;color:var(--ink)}
#s2g a{color:var(--accent);text-decoration:none}

/* progress rail */
#s2g .rail{display:flex;gap:6px;margin-bottom:34px;flex-wrap:wrap}
#s2g .rstep{flex:1 1 130px;padding:11px 8px 13px;border-top:4px solid var(--line);
  font-family:var(--mono);font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
#s2g .rstep.on{border-top-color:var(--accent);color:var(--accent)}
#s2g .rstep.done{border-top-color:var(--pass);color:var(--pass)}

#s2g .q{font-size:clamp(30px,5.2vw,46px);line-height:1.06;letter-spacing:-.02em;font-weight:800;margin-bottom:12px}
#s2g .qsub{font-size:19px;color:var(--ink-2);margin-bottom:28px;max-width:60ch}
#s2g .qsub strong{color:var(--ink)}

/* BIG buttons */
#s2g .bigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
#s2g .big{display:flex;align-items:center;gap:16px;min-height:84px;padding:18px 22px;
  background:var(--surface);border:2px solid var(--line);border-radius:6px;cursor:pointer;
  font:inherit;font-size:22px;font-weight:700;color:var(--ink);text-align:left;width:100%;
  transition:border-color .13s,background .13s,transform .13s}
#s2g .big:hover{border-color:var(--accent);background:var(--surface-2);transform:translateY(-2px)}
#s2g .big:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#s2g .big .bchip{width:38px;height:38px;flex:0 0 38px;border-radius:5px;
  border:1px solid rgba(170,185,200,.4);box-shadow:inset 0 -8px 12px -7px rgba(0,0,0,.65)}
#s2g .big .bmain{flex:1;min-width:0}
#s2g .big .bsub{display:block;font-size:14px;font-weight:400;color:var(--ink-3);margin-top:3px;
  font-family:var(--mono);letter-spacing:.04em}
#s2g .big .bdot{width:14px;height:14px;border-radius:50%;flex:0 0 14px}
#s2g .bdot.yes{background:var(--pass)}#s2g .bdot.no{background:var(--block)}#s2g .bdot.unknown{background:var(--unk)}

/* verdict */
#s2g .vbox{border:2px solid;border-radius:8px;padding:34px 30px;margin-bottom:26px}
#s2g .vbox.yes{background:var(--pass-bg);border-color:var(--pass-line)}
#s2g .vbox.no{background:var(--block-bg);border-color:var(--block-line)}
#s2g .vbox.unknown{background:var(--unk-bg);border-color:var(--unk-line)}
#s2g .vbig{font-size:clamp(34px,6.4vw,60px);line-height:1;font-weight:800;letter-spacing:-.03em;
  display:flex;align-items:center;gap:16px;margin-bottom:16px}
#s2g .vbig svg{width:.82em;height:.82em;flex:0 0 auto;stroke-width:3.4}
#s2g .vbox.yes .vbig{color:var(--pass)}#s2g .vbox.no .vbig{color:var(--block)}
#s2g .vbox.unknown .vbig{color:var(--unk)}
#s2g .vbox p{font-size:19px;margin-bottom:14px}
#s2g .vbox p:last-child{margin-bottom:0}
#s2g .vbox strong{color:var(--ink)}

/* switch cards */
#s2g .scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
#s2g .scard{background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:22px;
  cursor:pointer;font:inherit;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:12px;
  transition:border-color .13s,transform .13s}
#s2g .scard:hover{border-color:var(--accent);transform:translateY(-2px)}
#s2g .scard:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#s2g .scard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
#s2g .sname{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.12}
#s2g .sprice{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--pass)}
#s2g .sdesc{font-size:16px;color:var(--ink-2);line-height:1.5;flex:1}
#s2g .sact{font-family:var(--mono);font-size:13px;color:var(--ink-3);padding-top:12px;border-top:1px solid var(--line)}
#s2g .stag{align-self:flex-start;font-family:var(--mono);font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid}
#s2g .stag.lit{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
#s2g .stag.nolit{color:var(--ink-3);border-color:var(--line);background:var(--surface-2)}

#s2g .warn{display:flex;gap:14px;background:var(--unk-bg);border:1px solid var(--unk-line);
  border-radius:6px;padding:18px 20px;margin-bottom:24px;font-size:17px;color:var(--ink-2);line-height:1.5}
#s2g .warn b{color:var(--unk)}
#s2g .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
#s2g .opt{display:flex;align-items:center;gap:11px;min-height:60px;padding:12px 15px;background:var(--surface);
  border:2px solid var(--line);border-radius:5px;cursor:pointer;font:inherit;font-size:17px;font-weight:600;
  color:var(--ink);text-align:left;transition:border-color .13s}
#s2g .opt:hover{border-color:var(--accent)}
#s2g .opt:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#s2g .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
#s2g .opt .chip{width:24px;height:24px;flex:0 0 24px;border-radius:4px;border:1px solid rgba(170,185,200,.4)}
#s2g .lbl{font-family:var(--mono);font-size:13px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:30px 0 12px}
#s2g .cart{background:var(--surface);border:2px solid var(--pass-line);border-radius:8px;padding:24px;margin-top:26px}
#s2g .cart h3{font-size:22px;font-weight:800;margin-bottom:16px}
#s2g .ln{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg);border:1px solid var(--line);
  border-radius:5px;margin-bottom:10px;text-decoration:none;color:var(--ink);font-size:18px;transition:border-color .13s}
#s2g .ln:hover{border-color:var(--pass)}
#s2g .ln .lname{flex:1;font-weight:600}
#s2g .ln .lp{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--pass)}
#s2g .tot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:26px;font-weight:800;
  padding-top:16px;margin-top:6px;border-top:3px solid var(--pass)}
#s2g .nav{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
#s2g .btn{font:inherit;font-size:18px;font-weight:700;padding:16px 28px;border-radius:5px;cursor:pointer;
  border:2px solid var(--line);background:transparent;color:var(--ink-2);transition:border-color .13s,color .13s}
#s2g .btn:hover{border-color:var(--accent);color:var(--accent)}
#s2g .btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#s2g .panel[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#s2g *{transition:none!important}}
</style>
<div id="s2g">
  <div class="rail">
    <div class="rstep" data-r="1">1 &middot; Material</div>
    <div class="rstep" data-r="2">2 &middot; Finish</div>
    <div class="rstep" data-r="3">3 &middot; Answer</div>
    <div class="rstep" data-r="4">4 &middot; Switch</div>
  </div>
  <div class="panel" id="p1"></div>
  <div class="panel" id="p2" hidden></div>
  <div class="panel" id="p3" hidden></div>
  <div class="panel" id="p4" hidden></div>
</div>
<script>


// Convoy S2+ tail-switch compatibility data
// Compatibility source: https://www.gadgetconnections.com/pages/convoy-s2-faq
// Pricing / stock / variants: live Shopify pull 2026-08-08
const BASE = "https://www.gadgetconnections.com/products/";

const HOSTS = [
  // --- Anodized aluminium ---
  {id:"black",  name:"Black",        group:"Anodized Aluminium", verdict:"yes", sw:"#1e2124", handle:"convoy-s2", variant:"Black",  price:24.99, stock:58},
  {id:"gray",   name:"Gray",         group:"Anodized Aluminium", verdict:"yes", sw:"#7c8288", handle:"convoy-s2", variant:"Gray",   price:24.99, stock:5},
  {id:"golden", name:"Golden",       group:"Anodized Aluminium", verdict:"yes", sw:"#b8912f", handle:"convoy-s2", variant:"Golden", price:24.99, stock:17},

  {id:"red",    name:"Red",          group:"Anodized Aluminium", verdict:"no",  sw:"#9c2420", handle:"convoy-s2", variant:"Red",    price:24.99, stock:8},
  {id:"orange", name:"Orange",       group:"Anodized Aluminium", verdict:"no",  sw:"#c25a1c", handle:"convoy-s2", variant:"Orange", price:24.99, stock:16},
  {id:"purple", name:"Purple",       group:"Anodized Aluminium", verdict:"no",  sw:"#5b3a8e", handle:"convoy-s2", variant:"Purple", price:24.99, stock:6},
  {id:"tan",    name:"Tan",          group:"Anodized Aluminium", verdict:"no",  sw:"#a58a63", handle:"convoy-s2", variant:"Tan",    price:24.99, stock:7},
  {id:"silver", name:"Silver",       group:"Anodized Aluminium", verdict:"no",  sw:"#adb3b8", handle:"convoy-s2", variant:"Silver", price:24.99, stock:4},
  {id:"cyan",   name:"Cyan",         group:"Anodized Aluminium", verdict:"no",  sw:"#1d8f9c", handle:"convoy-s2", variant:"Cyan",   price:24.99, stock:3},
  // --- Specialty metals ---
  {id:"mao",    name:"MAO (Stone White)", group:"Specialty Metal", verdict:"yes", sw:"#ddd8cf", handle:"convoy-s2-mao-finish-micro-arc-oxidation-18650-flashlight", variant:null, price:33.99, stock:6},
  {id:"brass",  name:"Brass",        group:"Specialty Metal", verdict:"yes", sw:"#b08d3e", handle:"convoy-s2-18650-brass-flashlight", variant:null, price:41.99, stock:8},
  {id:"cu",     canon:"cu", name:"Copper (Litnit)", group:"Specialty Metal", verdict:"yes", sw:"#a5673c", handle:"convoy-s2-18650-flashlight-litnit", variant:null, price:59.99, stock:3},
  {id:"cugl",   canon:"cu", name:"Copper Glossy (unbranded)", group:"Specialty Metal", verdict:"yes", sw:"#bd7a45", handle:"convoy-s2-18650-copper-glossy-cu-flashlight-litnit-copy", variant:null, price:59.99, stock:3},
  // --- Titanium ---
  {id:"ti-gl",  name:"Ti Glossy",    group:"Titanium", verdict:"yes", sw:"#9aa0a6", handle:"convoy-s2-18650-titanium-ti-flashlight", variant:"Glossy", price:59.99, stock:5},
  {id:"ti-sw",  name:"Ti Stone Washed", group:"Titanium", verdict:"yes", sw:"#868d94", handle:"convoy-s2-18650-titanium-ti-flashlight", variant:"Stone Washed", price:59.99, stock:6},
  {id:"ti-gc",  name:"Ti Gold Circuit", group:"Titanium", verdict:"yes", sw:"#8d7a3f", handle:"convoy-s2-18650-titanium-ti-flashlight-specialty-finishes", variant:"Gold Circuit", price:69.99, stock:1},
  {id:"ti-mc",  name:"Ti Multi-Color Circuit", group:"Titanium", verdict:"yes", sw:"#5e6f8a", handle:"convoy-s2-18650-titanium-ti-flashlight-specialty-finishes", variant:"Multi-Color Circuit", price:69.99, stock:4},
  {id:"ti-sp",  name:"Ti Multi-Color Spatter", group:"Titanium", verdict:"no", sw:"#6b6f7d", handle:"convoy-s2-18650-titanium-ti-flashlight-specialty-finishes", variant:"Multi-Color Spatter", price:69.99, stock:3},
  {id:"ti-grc", name:"Ti Green Circuit (LE)", group:"Titanium", verdict:"no", sw:"#4d6b52", handle:"convoy-s2-18650-titanium-ti-flashlight-green-circuit-limited-edition", variant:null, price:69.99, stock:0},
  {id:"ti-ps",  name:"Ti Purple Swirl", group:"Titanium", verdict:"unknown", sw:"#6d5a86", handle:"convoy-s2-18650-titanium-ti-flashlight-purple-swirl", variant:null, price:79.99, stock:1}
];

const SWITCHES = [
  {id:"rubber", name:"Rubber Illuminated", handle:"convoy-illuminated-tail-switch-button-rubber",
   price:3.99, priceNote:"RGB $4.99", stock:196, lit:true,
   pitch:"Brightest glow. Rubber diffuses the LED, so it shows noticeably more light than the metal version.",
   action:"Reverse clicky — full click on, tap to change modes",
   colors:[["Orange","#c25a1c",27],["Blue","#20509a",31],["Green","#1f6b3a",32],["Red","#9c2420",25],["Purple","#5b3a8e",16],["Pink","#c96792",19],["White","#e8e8e6",20],["RGB Slow Fade","linear-gradient(135deg,#9c2420,#b8912f,#1f6b3a,#20509a,#5b3a8e)",26]]},
  {id:"metal", name:"Metal Illuminated", handle:"convoy-s2-illuminated-tail-switch-button",
   price:4.99, priceNote:"RGB $5.25", stock:198, lit:true,
   pitch:"Machined metal ring with a swappable centre button. Dimmer glow than rubber, but a harder, more tactile press.",
   action:"Reverse clicky — full click on, tap to change modes",
   colors:[["Orange","#c25a1c",37],["Blue","#20509a",28],["Green","#1f6b3a",27],["Red","#9c2420",15],["Purple","#5b3a8e",12],["Pink","#c96792",17],["White","#e8e8e6",37],["RGB Slow Fade","linear-gradient(135deg,#9c2420,#b8912f,#1f6b3a,#20509a,#5b3a8e)",25]]},
  {id:"forward", name:"Forward Clicky", handle:"convoy-forward-clicky-switch-for-s2-full-pcb-assembly",
   price:1.99, priceNote:"full PCB assembly", stock:36, lit:false,
   pitch:"Momentary signalling without committing the light on. Cannot be illuminated — no illuminated forward clicky exists.",
   action:"Half-press for momentary on, full click to stay on",
   colors:[]}
];

const METAL_BUTTONS = {
  handle:"convoy-black-button-for-metal-illuminated-switch", price:0.99,
  colors:[["Silver Aluminum","#adb3b8",38],["Black","#1e2124",35],["Clear Plastic","#dfe4e6",38],["Blue","#20509a",37],["Cyan","#1d8f9c",38],["Deep Green","#1f5b39",39],["Gray","#7c8288",38],["Orange","#c25a1c",39],["Purple","#5b3a8e",38],["Red","#9c2420",36],["Tan","#a58a63",37]]
};
const BRASS_BUTTON = {handle:"convoy-brass-button-for-metal-illuminated-switch", price:1.99, stock:30, name:"Brass", sw:"#b08d3e"};
const PLAIN_BUTTONS = {handle:"convoy-color-rubber-tail-cap-buttons-for-s2-c8-and-more", price:0.25,
  colors:[["Black","#1e2124",33],["Orange","#c25a1c",42],["Green (does NOT glow)","#1f6b3a",40],["Blue (glow)","#20509a",31],["Translucent / White","#e8e8e6",21]]};


var ICON={yes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
no:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
unknown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.1 9a3 3 0 1 1 4.5 2.6c-.9.5-1.6 1.3-1.6 2.4v.5"/><path d="M12 18.5h.01"/></svg>'};
var G={mat:null,host:null,sw:null,led:null,step:1};
function money(n){return "$"+n.toFixed(2)}
function u(h){return BASE+h}
function MATS(){var o=[];HOSTS.forEach(function(h){if(o.indexOf(h.group)<0)o.push(h.group)});return o}
function rail(){
  for(var i=1;i<=4;i++){var e=document.querySelector('#s2g .rstep[data-r="'+i+'"]');
    e.className='rstep'+(i===G.step?' on':(i<G.step?' done':''))}}
function show(n){G.step=n;for(var i=1;i<=4;i++)document.getElementById('p'+i).hidden=(i!==n);rail();}

function p1(){
  var m=MATS();
  document.getElementById('p1').innerHTML=
   '<h2 class="q">What is your S2+ made of?</h2>'+
   '<p class="qsub">Start here. Whether you can change the tail switch is decided entirely by the '+
   'finish you own &mdash; and <strong>about half cannot</strong>.</p><div class="bigs">'+
   m.map(function(g){var n=HOSTS.filter(function(h){return h.group===g});
     var y=n.filter(function(h){return h.verdict==="yes"}).length;
     return '<button class="big" type="button" data-m="'+g+'">'+
       '<span class="bmain">'+g+'<span class="bsub">'+n.length+' finishes &middot; '+y+' accept a swap</span></span>'+
       '<span style="font-size:26px;color:var(--ink-3)">&rarr;</span></button>'}).join('')+'</div>';
  document.querySelectorAll('#p1 .big').forEach(function(b){
    b.addEventListener('click',function(){G.mat=b.dataset.m;G.host=null;G.sw=null;G.led=null;p2();show(2);
      document.getElementById('s2g').scrollIntoView({behavior:'smooth',block:'start'})})});
}
function p2(){
  var n=HOSTS.filter(function(h){return h.group===G.mat});
  document.getElementById('p2').innerHTML=
   '<h2 class="q">Which '+G.mat.toLowerCase()+' finish?</h2>'+
   '<p class="qsub">Pick the one you own.</p><div class="bigs">'+
   n.map(function(h){return '<button class="big" type="button" data-h="'+h.id+'">'+
     '<span class="bchip" style="background:'+h.sw+'"></span>'+
     '<span class="bmain">'+h.name+'<span class="bsub">'+money(h.price)+'</span></span>'+
     '<span class="bdot '+h.verdict+'"></span></button>'}).join('')+'</div>'+
   '<div class="nav"><button class="btn" type="button" id="b2">&larr; Back to materials</button></div>';
  document.querySelectorAll('#p2 .big').forEach(function(b){
    b.addEventListener('click',function(){G.host=HOSTS.filter(function(h){return h.id===b.dataset.h})[0];
      G.sw=null;G.led=null;p3();show(3);
      document.getElementById('s2g').scrollIntoView({behavior:'smooth',block:'start'})})});
  document.getElementById('b2').addEventListener('click',function(){show(1)});
}
function p3(){
  var h=G.host,v=h.verdict,body;
  if(v==="yes"){
    body='<p>Your <strong>'+h.name+'</strong> has a removable tail cap. Pick any <strong>one</strong> of three switches next.</p>';
  }else if(v==="no"){
    var alts=HOSTS.filter(function(x){return x.verdict==="yes"}).slice(0,3);
    body='<p>The <strong>'+h.name+'</strong> tail switch is <strong>pressure-fit</strong> &mdash; pressed in at the '+
      'factory. It does not come out, and forcing it damages the cap.</p>'+
      '<p>You can still change the look with a <a href="'+u(PLAIN_BUTTONS.handle)+'" target="_blank" rel="noopener">'+
      'coloured rubber tailcap button</a> ('+money(PLAIN_BUTTONS.price)+') &mdash; but it will not light up.</p>'+
      '<p style="margin-top:18px"><strong>Hosts that do accept a swap:</strong></p>'+
      alts.map(function(a){return '<a class="ln" href="'+u(a.handle)+'" target="_blank" rel="noopener">'+
        '<span class="bchip" style="background:'+a.sw+'"></span><span class="lname">S2+ '+a.name+'</span>'+
        '<span class="lp">'+money(a.price)+'</span></a>'}).join('');
  }else{
    body='<p>The <strong>'+h.name+'</strong> is on neither compatibility list. We will not guess &mdash; '+
      'message us and we will open one to confirm.</p>';
  }
  document.getElementById('p3').innerHTML=
   '<div class="vbox '+v+'"><div class="vbig">'+ICON[v]+'<span>'+
   (v==="yes"?"Yes &mdash; it fits":v==="no"?"No &mdash; it cannot":"Not documented")+'</span></div>'+body+'</div>'+
   '<div class="nav"><button class="btn" type="button" id="b3">&larr; Pick a different finish</button>'+
   (v==="yes"?'<button class="btn" type="button" id="n3" style="border-color:var(--pass);color:var(--pass)">Choose a switch &rarr;</button>':'')+'</div>';
  document.getElementById('b3').addEventListener('click',function(){show(2)});
  if(v==="yes"){document.getElementById('n3').addEventListener('click',function(){p4();show(4);
    document.getElementById('s2g').scrollIntoView({behavior:'smooth',block:'start'})})}
}
function ledPrice(s,l){if(!l)return s.price;var r=l.indexOf("RGB")===0;
  return s.id==="rubber"?(r?4.99:3.99):s.id==="metal"?(r?5.25:4.99):s.price}
function p4(){
  var h='<h2 class="q">Pick one switch</h2><p class="qsub">Your host takes exactly one of these three.</p>'+
   '<div class="warn"><span style="font-size:24px">&#9888;</span><span><b>Illuminated and forward clicky cannot be combined.</b> '+
   'No illuminated forward clicky exists &mdash; momentary operation means giving up the glowing tail.</span></div><div class="scards">'+
   SWITCHES.map(function(s){return '<button class="scard" type="button" data-s="'+s.id+'" aria-pressed="'+
     (G.sw&&G.sw.id===s.id)+'"><span class="sname">'+s.name+'</span><span class="sprice">'+money(s.price)+'</span>'+
     '<span class="stag '+(s.lit?"lit":"nolit")+'">'+(s.lit?"Illuminated":"No light")+'</span>'+
     '<span class="sdesc">'+s.pitch+'</span><span class="sact">'+s.action+'</span></button>'}).join('')+'</div>';
  if(G.sw&&G.sw.colors.length){
    h+='<div class="lbl">LED colour</div><div class="opts">'+
      G.sw.colors.map(function(c){return '<button class="opt" type="button" data-l="'+c[0]+'" aria-pressed="'+
      (G.led===c[0])+'"><span class="chip" style="background:'+c[1]+'"></span><span>'+c[0]+'</span></button>'}).join('')+'</div>';
  }
  if(G.sw){
    var rows=[[G.host.name,G.host.price,G.host.handle,G.host.sw]];
    rows.push([G.sw.name+(G.led?" — "+G.led:""),ledPrice(G.sw,G.led),G.sw.handle,null]);
    h+='<div class="cart"><h3>Your parts</h3>'+rows.map(function(r){
      return '<a class="ln" href="'+u(r[2])+'" target="_blank" rel="noopener">'+
      (r[3]?'<span class="bchip" style="background:'+r[3]+'"></span>':'')+
      '<span class="lname">'+r[0]+'</span><span class="lp">'+money(r[1])+'</span></a>'}).join('')+
      '<p style="font-size:15px;color:var(--ink-3);margin-top:16px;padding-top:16px;'+
      'border-top:1px solid var(--line)">Emitter, reflector and lens are chosen on the S2+ '+
      'product page &mdash; open the host link above to pick them.</p></div>';
  }
  h+='<div class="nav"><button class="btn" type="button" id="b4">&larr; Back to the answer</button>'+
     '<button class="btn" type="button" id="r4">Start over</button></div>';
  document.getElementById('p4').innerHTML=h;
  document.querySelectorAll('#p4 .scard').forEach(function(b){b.addEventListener('click',function(){
    G.sw=SWITCHES.filter(function(s){return s.id===b.dataset.s})[0];G.led=null;p4()})});
  document.querySelectorAll('#p4 .opt').forEach(function(b){b.addEventListener('click',function(){
    G.led=(G.led===b.dataset.l)?null:b.dataset.l;p4()})});
  document.getElementById('b4').addEventListener('click',function(){show(3)});
  document.getElementById('r4').addEventListener('click',function(){G={mat:null,host:null,sw:null,led:null,step:1};p1();show(1)});
}
p1();show(1);

</script>
